<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FreeWeight{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0 auto;
      max-width: 72rem;
      padding: 0 1.5rem 3rem;
      line-height: 1.5;
    }
    .skip-link {
      position: absolute;
      left: -9999px;
    }
    .skip-link:focus {
      left: 1rem;
      top: 1rem;
      padding: 0.5rem 0.75rem;
      background: Canvas;
      outline: 2px solid currentColor;
    }
    header { border-bottom: 1px solid rgba(128, 128, 128, 0.4); }
    nav ul { display: flex; gap: 1.25rem; list-style: none; padding: 0; }
    nav a[aria-current="page"] { font-weight: 700; text-decoration: none; }
    .version { color: gray; font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; width: 100%; }
    th, td {
      border-bottom: 1px solid rgba(128, 128, 128, 0.3);
      padding: 0.4rem 0.75rem;
      text-align: left;
      vertical-align: top;
    }
    td.numeric { font-variant-numeric: tabular-nums; text-align: right; }
    .muted { color: gray; }
    .empty-state, .error-state {
      border: 1px dashed rgba(128, 128, 128, 0.6);
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .error-state { border-style: solid; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    /* UI standards §4.1: colour is never the only signal, so a status is always its own word
       as well as its colour, and the border carries the distinction for monochrome and for
       forced-colours mode. */
    .status {
      border: 1px solid currentColor;
      border-radius: 0.25rem;
      padding: 0 0.35rem;
      font-size: 0.9em;
      white-space: nowrap;
    }
    .status-queued, .status-pending, .status-cancelled, .status-skipped { color: gray; }
    .status-preparing, .status-warming { color: #2563eb; }
    .status-running, .status-cancelling { color: #7c3aed; }
    .status-completed { color: #15803d; }
    .status-failed, .status-timeout { color: #b91c1c; }
    .status-interrupted { color: #b45309; }
    .event-log { font-variant-numeric: tabular-nums; max-height: 24rem; overflow-y: auto; }
    .event-log li { margin-bottom: 0.15rem; }
    progress { width: 100%; }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header>
    <h1>FreeWeight <span class="version">v{{ app_version }}</span></h1>
    <nav aria-label="Primary">
      <ul>
        <li><a href="/" {% if page == 'home' %}aria-current="page"{% endif %}>Overview</a></li>
        <li><a href="/machines" {% if page == 'machines' %}aria-current="page"{% endif %}>Machines</a></li>
        <li><a href="/models" {% if page == 'models' %}aria-current="page"{% endif %}>Models</a></li>
        <li><a href="/runs" {% if page == 'runs' %}aria-current="page"{% endif %}>Runs</a></li>
      </ul>
    </nav>
    {% include "partials/telemetry_bar.html" %}
  </header>
  <main id="content">
    {% block content %}
    <p>The application shell is running.</p>
    {% endblock %}
  </main>
  <script src="/static/js/telemetry.js" defer></script>
</body>
</html>
