[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freeweight"
description = "Measures local open-weight models across capability, efficiency, reliability and resource use, with reproducible provenance and exportable capability evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# weightsdb and mirrorwall are adopted at Phase 12 (extracted from this application's own in-app plumbing at LoadCoach P1/P4); not a dependency until then.
dependencies = [
    "baseaicore>=0.4,<0.5",
    "setspec>=0.3,<0.4",
    "modelrack>=0.5,<0.6",
    "sweatmeter>=0.4,<0.5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "typer>=0.12,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
postgresql = [
    "psycopg[binary]>=3.2,<4",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
    "freeweight[postgresql]",
]

[project.urls]
Homepage = "https://github.com/JPKell/FreeWeight"
Documentation = "https://github.com/JPKell/FreeWeight/tree/main/docs"
Changelog = "https://github.com/JPKell/FreeWeight/blob/main/CHANGELOG.md"

[project.scripts]
freeweight = "freeweight.cli.main:app"

[tool.hatch.version]
path = "src/freeweight/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/freeweight"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]
# Alembic-generated: upgrade()/downgrade() carry no behaviour beyond the revision's own docstring,
# and their bodies are op.* DDL calls Alembic itself generated, not hand-written business logic.
"src/freeweight/infrastructure/db/migrations/versions/*.py" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/freeweight"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
