[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freeweight"
description = "Measures local open-weight models across capability, efficiency, reliability and resource use, with reproducible provenance and exportable capability evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "baseaicore>=0.4,<0.5",
    # Adopted at Phase 12: both were extracted from this application's own in-app plumbing at
    # LoadCoach P1/P4 (ADR-0011), and the in-app copies are deleted in the same phase. The
    # acceptance criterion for the swap was the pre-existing test suite passing unchanged.
    "weightsdb>=0.2,<0.3",
    "mirrorwall>=0.2,<0.3",
    # 0.4 adds setspec.prompts (SetSpec Phase 5): the prompt loader, renderer and hasher this
    # module now delegates to (freeweight.services.prompts is a thin default-path wrapper around
    # it as of this release) — extracted from this application's own in-app implementation at
    # LoadCoach Phase 4 / SetSpec Phase 5 (ADR-0011, ADR-0028), with FreeWeight's existing pack
    # proven to hash identically before and after the move.
    "setspec>=0.4,<0.5",
    "modelrack>=0.5,<0.6",
    "sweatmeter>=0.4,<0.5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "typer>=0.12,<1",
    "jinja2>=3.1,<4",
    # Required by FastAPI to read an HTML form body. The run page's "start a run" form is the
    # first form in the application with fields in it (ADR-0020: server-rendered forms, no SPA);
    # Phase 4's only form posts an empty body and needed no parser.
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
postgresql = [
    "psycopg[binary]>=3.2,<4",
]
# Pinned to the majors this repository's gate is actually verified against. They were previously
# a major behind on four of the seven, so CI installed a different toolchain than any developer
# ran — and a mypy 1 / mypy 2 disagreement is exactly the kind of thing that turns up as a red
# build nobody can reproduce locally.
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-randomly>=4,<5",
    "mypy>=2,<3",
    "ruff>=0.16,<1",
    "import-linter>=2.13,<3",
    "respx>=0.23,<1",
    # Testing standards §10 lists diff-cover among the gates required before merge, so it belongs
    # in the extra a developer installs rather than only in the CI step.
    "diff-cover>=9,<11",
    # The producer's half of testing standards §8: what FreeWeight emits is validated against the
    # *published* JSON Schema SetSpec ships, not only against the model that generated it. Test
    # only; nothing under `src/` imports it.
    "jsonschema>=4.23,<5",
    "types-jsonschema>=4.23,<5",
    "freeweight[postgresql]",
]

[project.urls]
Homepage = "https://github.com/JPKell/FreeWeight"
Documentation = "https://github.com/JPKell/FreeWeight/tree/main/docs"
Changelog = "https://github.com/JPKell/FreeWeight/blob/main/CHANGELOG.md"

[project.scripts]
freeweight = "freeweight.cli.main:app"

[tool.hatch.version]
path = "src/freeweight/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/freeweight"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The mock-tool fixture repository is *data the tools read*, not source this application imports,
# runs or formats. It is a real directory on disk because the containment tests have to defeat
# real symlinks and real `..` traversal, and a lint pass over it would rewrite the very bytes a
# benchmark's fixture hash depends on.
extend-exclude = ["src/freeweight/benchmarks/fixtures/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]
# Alembic-generated: upgrade()/downgrade() carry no behaviour beyond the revision's own docstring,
# and their bodies are op.* DDL calls Alembic itself generated, not hand-written business logic.
"src/freeweight/infrastructure/db/migrations/versions/*.py" = ["D1"]
# A developer script whose entire output is what it tells the person who ran it.
"scripts/*.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true
exclude = ['^src/freeweight/benchmarks/fixtures/data/']

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
# Five modules import shared fixtures as `tests.conftest`. Under the default `prepend` import mode
# pytest puts the *test file's* directory on sys.path, not the repository root, so `import tests`
# resolves only when the runner happens to insert the cwd — `python -m pytest` does, the bare
# `pytest` console script does not, and CI runs the bare one. Stating the root here makes both
# invocations agree.
pythonpath = ["."]
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
    # The roadmap's integration milestones (§4): "none is considered complete on the basis of a
    # code review". The verification exists as ordinary tests; this marker is what lets a reviewer
    # point at it — `pytest -m "integration_milestone and I2"` answers "show me I2".
    "integration_milestone: verifies a roadmap §4 integration milestone",
    "I1: FreeWeight <-> ModelRack — discovery through ModelRack only, no provider HTTP here",
    "I2: FreeWeight <-> SweatMeter — telemetry live, machine profile persisted, no-GPU path",
    "I3: FreeWeight -> SetSpec — exports validate against the schemas and the goldens",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/freeweight"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
