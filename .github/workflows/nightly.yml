# Testing Standards §10: the default suite runs on every push and must stay under three minutes,
# so the `live` suite, which needs real weights, runs here instead.
#
# On a GitHub-hosted runner the live suite **skips itself**: its provider fixture calls
# `OllamaProvider.health()` and skips when nothing answers on 127.0.0.1:11434. That is deliberate
# and is not a silent pass — the job prints the skip reasons with `-rs`, so "no Ollama here" is
# visible rather than indistinguishable from "everything passed". Point a self-hosted runner with a
# GPU at this workflow and the same job measures a real model.
#
# `performance` is **not** here. Its budgets are calibrated against the reference machine, and a
# GitHub-hosted runner is roughly half its speed, so a nightly on shared hardware went red for the
# runner rather than for a regression. Packaging standards §5 puts the budgets on a self-hosted
# runner with the hardware; until this suite registers one, they run on the reference machine with
# `pytest -m performance` and nowhere else.
#
# That costs this repository the query-plan assertions in
# `tests/performance/test_dashboard_queries.py`, which are hardware-independent and would have been
# safe here — they share a file with wall-clock budgets and have no marker of their own to select
# them by.
name: Nightly

on:
  schedule:
    # 03:00 UTC — after any working day's pushes, before any working morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      # `-rs` reports every skip with its reason: a live suite that skipped because nothing was
      # serving must not look like a live suite that passed.
      - run: pytest -m live -rs
